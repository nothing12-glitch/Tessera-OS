    <rect x="25" y="25" width="26" height="26" rx="9" fill="#3350C8"/>
    <rect x="57" y="25" width="26" height="26" rx="9" fill="#8FB0FF"/>
    <rect x="25" y="57" width="26" height="26" rx="9" fill="#C8D8FF"/>
    <path d="M70 55 L85 70 L70 85 L55 70 Z" fill="#E8B23A"/>
  </g>
  <text x="68" y="47" font-family="Unbounded, Manrope, system-ui, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.5" fill="#EDF0FA">Tessera<tspan fill="#E8B23A">OS</tspan></text>
</svg>
