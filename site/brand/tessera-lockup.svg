<?xml version="1.0" encoding="utf-8"?>
<!--
  Логотип-заголовок (lockup): знак + напис.

  Напис набраний брендовим шрифтом Unbounded (OFL 1.1, див. brand/TYPE.md).
  SVG-текст рендериться тим шрифтом, який доступний у переглядача: на сайті
  він самохостований, тож виглядає як задумано; у редакторах без шрифта
  підставиться системний — це єдине місце, де таке допустимо, бо сам знак
  (tessera-mark.svg) від шрифта не залежить.

  «OS» свідомо теплішого кольору: це той самий акцент, що й у повернутій
  плитці знака.
  Apache-2.0 © TesseraOS contributors
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" width="340" height="72" role="img" aria-label="TesseraOS">
