<!--
  Основний знак TesseraOS.

  «Tessera» — мозаїчна плитка. Знак = поле з чотирьох плиток, три з яких
  лежать у сітці, а четверта повернута на 45°: це та плитка, що задає
  візерунок усій системі. Геометрія навмисно проста — знак читається з 16 px
  і не повторляє жодної чужої торгової марки.

  Мотив вписаний у 25…85 із 108, тому той самий файл працює і як
  foreground adaptive-іконки (безпечна зона 66 dp по центру).

  Кольори — маркові, не системні: див. brand/PALETTE.md.
  Apache-2.0 © TesseraOS contributors
-->
