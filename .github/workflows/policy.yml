# Політика репозиторію: жодних власницьких бінарних ресурсів, жодних
# торгових марок Google, ліцензії на залежності. Див. docs/GAPPS.md.
name: policy

on: [push, pull_request, merge_group]

permissions:
  contents: read

jobs:
  no-proprietary-blobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Заборона бінарів у git
        run: |
          set -euo pipefail
          BAD=$(find . -type f \( -name '*.so' -o -name '*.apk' -o -name '*.jar' \
               -o -name '*.aar' -o -name '*.img' -o -name '*.zip' \) \
               -not -path './.git/*' || true)
          if [[ -n "$BAD" ]]; then
            echo "Бінарні файли не належать до репозиторію:"; echo "$BAD"; exit 1
          fi

      - name: Заборона марок Google / Pixel у тому, що потрапляє в образ
        run: |
          set -euo pipefail
          # Скануємо лише те, що збирається в image (ресурси, конфіги, маніфест).
          # Документація навмисне називає заборонені речі — її чіпати не треба.
          SCOPE="overlay overlay-packages build config manifest apps"
          HIT=$(grep -rniE 'pixel launcher|product sans|google material icon|bootanimation' \
                 $SCOPE 2>/dev/null || true)
          if [[ -n "$HIT" ]]; then
            echo "$HIT"
            echo "Знайшов ознаки чужого бренда (Google/Pixel) у тому, що потрапляє в образ."
            exit 1
          fi
          echo "чисто: $SCOPE"

      - name: Ліцензія Apache-2.0 присутня
        run: |
          set -euo pipefail
          head -3 LICENSE | grep -qi 'apache license' || { echo "LICENSE не Apache-2.0"; exit 1; }
          grep -qi 'Version 2.0' LICENSE || { echo "LICENSE: немає рядка про версію 2.0"; exit 1; }
          for d in overlay/themes/*/; do
            [[ -d "$d" ]] || continue
            grep -qi 'license' "$d/Android.bp" || echo "увага: $d не має рядка про ліцензію в Android.bp"
          done
          echo "ok: LICENSE = Apache-2.0"

  # Конфіг збірки не повинен посилатися на файли, яких у базі немає. Без цього
  # кроку «зелений проєкт» може роками ховати dead-посилання: образ у CI не
  # збирається, тож єдиний, хто про це дізнається, — людина з 6-годинною
  # збіркою на self-hosted білд-боксі.
  build-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Усі посилання шару збірки існують у LineageOS 22.2
        run: bash build/scripts/check-build-refs.sh
