# Публікація установчого пакунка TesseraOS для віртуальної машини.
#
# Чому пакунок APK, а не образ: повний .img збирається лише на Linux-білдбоксі
# з 250+ ГБ і 6+ годинами роботи (див. docs/BUILD.md), а policy.yml забороняє
# будь-які бінарники в гілці. Архів із застосунками, темою та інсталяторами
# зʼявляється в GitHub Release — це те, чим можна скористатися сьогодні.
#
# Образ .img публікує build-rom.yml тим самим механізмом (артефакт запуску),
# коли є self-hosted білд-бокс.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: "8.14.3"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      # Історія і теги потрібні повні: changelog рахуємо від попередньої віхи,
      # а checkout@v4 за замовчуванням приносить один коміт без тегів — тоді
      # «що змінилось» мовчки виходило порожнім рядком.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Дешево й до збірки: чи кожен застосунок з реєстру справді в образі,
      # і чи Windows-інсталятор не відстав від того ж реєстру.
      - name: Перевірити інтеграцію в ROM
        run: bash build/scripts/check-app-integration.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Той самий крок, що й у build-apps.yml: без platforms/android-35
      # gradle просто не дійде до збірки, а пакунок має збиратися з першого
      # запуску, а не з третього.
      - name: Перевірити Android SDK на раннері
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          [[ -d "$SDK" ]] || { echo "немає Android SDK за $SDK" >&2; exit 1; }
          if ! ls -d "$SDK"/platforms/android-35 >/dev/null 2>&1; then
            echo "на раннері немає platforms/android-35 — ставимо через sdkmanager" >&2
            "$SDK"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
            "$SDK"/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
          fi
          ls -1 "$SDK/platforms"

      - name: Встановити Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -euo pipefail
          ZIP="gradle-${GRADLE_VERSION}-bin.zip"
          curl -fsSLO "https://services.gradle.org/distributions/${ZIP}"
          curl -fsSL "https://services.gradle.org/distributions/${ZIP}.sha256" > "${ZIP}.sha256.expected"
          printf '%s  %s\n' "$(cat "${ZIP}.sha256.expected")" "$ZIP" | sha256sum --check --strict
          unzip -q "$ZIP" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      # Збираємо всі застосунки з реєстру: той самий список, що й для образу,
      # тому «було в CI, але не в пакунку» тут неможливе. Від 2026-10-25 реєстр
      # закритий, тому цикл проходить нуль разів — це стан продукту, а не
      # поломка.
      - name: Зібрати APK і юніт-тести кожного застосунку
        run: |
          set -euo pipefail
          # Каталог створюємо заздалегідь: make-vm-bundle.sh отримує
          # --from /tmp/apks навіть тоді, коли сюди не попав жоден APK.
          mkdir -p /tmp/apks
          while IFS='|' read -r dir module pkg artifact extra; do
            [[ -z "$dir" || "$dir" =~ ^[[:space:]]*# ]] && continue
            echo "::group::$dir"
            ( cd "apps/$dir" && gradle --no-daemon --console=plain \
                -Pandroid.sdk.channel=0 :app:testDebugUnitTest :app:assembleDebug )
            src="apps/$dir/app/build/outputs/apk/debug/app-debug.apk"
            [[ -f "$src" ]] || { echo "немає $src" >&2; exit 1; }
            mkdir -p /tmp/apks
            cp "$src" "/tmp/apks/$module.apk"
            echo "::endgroup::"
          done < build/scripts/apps.list

      - name: Зібрати оформлення (оверлеї MD3)
        run: |
          set -euo pipefail
          # build-themes.sh чітає aapt2/zipalign/apksigner з PATH, а на раннері
          # вони лежать у $SDK/build-tools/<версія>/ й у PATH їх немає. Без
          # цього пакунок мовчки виходив без теми.
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(ls -1d "$SDK"/build-tools/*/ 2>/dev/null | sort -V | tail -1)"
          [[ -n "$BT" ]] || { echo "на раннері немає build-tools — оверлеїв у пакунку не буде" >&2; }
          if [[ -n "$BT" ]]; then
            export AAPT2="${BT%/}/aapt2" ZIPALIGN="${BT%/}/zipalign" APKSIGNER="${BT%/}/apksigner"
            bash build/scripts/build-themes.sh || echo "увага: оверлеї не зібрались — пакунок буде без теми"
          fi

      - name: Створити пакунок
        run: |
          set -euo pipefail
          bash build/scripts/make-vm-bundle.sh --from /tmp/apks --themes
          ls -l dist

      - name: Перевірити, що в dist немає зайвого
        run: |
          set -euo pipefail
          # Пакунок — єдине, що ми віддаємо: жодних .img і жодних ключів.
          if find dist -type f \( -name '*.img' -o -name '*.pk8' -o -name '*.pem' -o -name '*.keystore' -o -name '*.jks' \) | grep -q .; then
            echo "у пакунку не має бути образів і ключів" >&2; exit 1
          fi
          echo ok

      - name: Оприлюднити реліз
        run: |
          set -euo pipefail
          # Ручний запуск не має тега — тож і реліз буде чернеткою, а не
          # «оста́точним» з недійсним іменем. Помилкою це не стає навмисно:
          # перевірити пакунок треба й до віхи.
          DRAFT=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="bundle-draft"
            DRAFT=(--draft)
          fi
          ARCHIVE="$(ls -1 dist/*.tar.xz | head -1)"
          DIR="dist/$(basename "${ARCHIVE%.tar.xz}")"
          # «Що змінилось» = коміти від попередньої віхи. PREV — найстаріший
          # з існуючих тегів, доданих до HEAD, крім поточного: для push із
          # тегом це попередня віха, для workflow_dispatch (TAG=bundle-draft,
          # тегу немає) — остання віха загалом.
          PREV="$(git tag --sort=-creatordate --merged HEAD | grep -v "^${TAG}\$" | head -1 || true)"
          if [[ -z "$PREV" ]]; then
            RANGE="HEAD"
            FROM_ROW="(віх досі немає — це перший пакунок, тож нижче вся історія)"
          else
            RANGE="${PREV}..HEAD"
            FROM_ROW="(коміти від $PREV)"
          fi
          CHANGELOG="$(git log --no-merges --pretty='- %s (%h)' $RANGE | head -400)"
          [[ -n "$CHANGELOG" ]] || CHANGELOG="— (від $PREV до $TAG жодного нового коміту)"
          N_APKS="$(find "$DIR/apks" -name '*.apk' | wc -l)"
          N_OVL="$(find "$DIR/overlays" -name '*.apk' 2>/dev/null | wc -l || true)"
          # Текст релізу описує ФАКТИЧНИЙ вміст. Раніше «$N_APKS застосунків»
          # друкувалось і коли їх нуль — а саме так тепер і є: у продукті лишилась
          # лише тема, застосунки дає система.
          if [[ "$N_APKS" -gt 0 && "$N_OVL" -gt 0 ]]; then
            INSIDE="$N_APKS застосунків і RRO-оверлеї теми MD3 ($N_OVL шт.)"
          elif [[ "$N_APKS" -gt 0 ]]; then
            INSIDE="$N_APKS застосунків; RRO-оверлеїв теми в цьому пакунку немає — тільки наші застосунки на стоковій палітрі"
          elif [[ "$N_OVL" -gt 0 ]]; then
            INSIDE="лише оформлення: RRO-оверлеї теми MD3 ($N_OVL шт.) поверх системного лаунчера й системних застосунків. Власних застосунків у продукті від 2026-10-25 немає — рішення користувача після перевірки на живому пристрої; код лишився в apps/ і в пакунку v15.22.2.2"
          else
            INSIDE="нічого: ані застосунків, ані оверлеїв — такий пакунок не вносить жодної зміни"
          fi
          NOTES="TesseraOS $TAG — установчий пакунок для VM.

          У пакунку: $INSIDE.

          Розпакуй і запусти \`install-on-vm.sh\` (Linux/macOS/Git Bash) або
          \`install-on-vm.ps1\` (Windows) проти вже запущеної гостьової системи з
          Android 13+. Докладно: docs/VM-INSTALL.md.

          APK підписані тестовим ключем: це пакунок для ознайомлення, а не
          оновлення вже встановленої системи.

          Суми — у \`$(basename "$ARCHIVE").sha256\` і всередині архіву.

          ## Що змінилось
          $FROM_ROW

          $CHANGELOG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
              --title "TesseraOS $TAG" --notes "$NOTES" "${DRAFT[@]}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
