# Повна збірка ROM потребує Linux-білдбоксу з 32 ГБ RAM, 400 ГБ і 6+ годин.
# GitHub-hosted раннери (7 ГБ / 14 ГБ RAM, 6-годинний ліміт) цього не витягнуть,
# тому workflow іде на self-hosted раннері з власними labels.
#
# Як підняти білд-бокс: docs/BUILD.md.
name: build-rom

on:
  workflow_dispatch:
    inputs:
      target:
        description: "lunch-таргет"
        default: "tessera_x86_64-userdebug"
      branch:
        description: "гілка бази LineageOS"
        default: "lineage-22.2"
  schedule:
    - cron: "0 3 * * 6"   # щосуботи: нічна збірка

concurrency:
  group: rom-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rom:
    runs-on: [self-hosted, linux, x86_64, rom-build]
    timeout-minutes: 720
    env:
      CCACHE_DIR: /cache/ccache
      USE_CCACHE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          path: tessera-os

      - name: Синхронізація джерел ( маніфест бази + наш шар )
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:$PATH"
          mkdir -p "$GITHUB_WORKSPACE/rom"
          cd "$GITHUB_WORKSPACE/rom"
          if [[ -d .repo ]]; then
            repo sync -c -j"$(nproc)" --fail-fast
          else
            # База — справжній маніфест LineageOS; наш шар додається через
            # .repo/local_manifests/ (саме це робить new-tree.sh). Ініціювати
            # збірку власним manifest/tessera.xml не можна: це додаток на один
            # проєкт, а не дерево на 1000+ проєктів.
            "$GITHUB_WORKSPACE/tessera-os/build/scripts/new-tree.sh" \
              "${{ inputs.branch || 'lineage-22.2' }}"
          fi

      - name: Статична перевірка посилань збірки
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/rom"
          "$GITHUB_WORKSPACE/tessera-os/build/scripts/check-build-refs.sh" --tree .

      - name: Збірка
        run: |
          cd "$GITHUB_WORKSPACE/rom"
          "$PWD/vendor/tessera/os/build/scripts/build-emulator.sh" \
            "${{ inputs.target || 'tessera_x86_64-userdebug' }}"

      - name: Артефакти образів
        uses: actions/upload-artifact@v4
        with:
          name: tessera-x86_64-images
          path: |
            rom/out/target/product/emu64x/*.img
            rom/out/target/product/emu64x/kernel-ranchu
            rom/out/target/product/emu64x/*.txt
          retention-days: 14
          if-no-files-found: error
