# Деплой статичного сайту проєкту на GitHub Pages.
# Збірки немає: site/ — це самодостатній index.html, тому артефактом іде сама папка.
name: Деплой сайту

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# GITHUB_TOKEN з pages:write потрібен і для одноразового вмикання Pages через API.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Перевірити, що сайт валідний
        run: |
          set -euo pipefail
          test -s site/index.html
          # баланс контейнерних тегів + наявність усіх id, на які посилається JS
          node -e '
          const fs = require("fs");
          const h = fs.readFileSync("site/index.html", "utf8");
          const vm = require("vm");
          for (const m of h.matchAll(/<script>([\s\S]*?)<\/script>/g)) new vm.Script(m[1]);
          const declared = new Set([...h.matchAll(/id="([A-Za-z][\w-]*)"/g)].map(x => x[1]));
          // \x27 — апостроф: лапки оболонки всередині рядка не ламаються
          const used = [...h.matchAll(/getElementById\(\s*[\x27"]([A-Za-z][\w-]*)[\x27"]\s*\)/g)]
            .map(x => x[1]);
          const missing = used.filter(id => !declared.has(id));
          if (missing.length) { console.error("немає id в HTML:", missing.join(", ")); process.exit(1); }
          console.log("ok: скрипт парситься, " + used.length + " id знайдено");
          '

      # Pages увімкнено у режимі "GitHub Actions", а не "з гілки": інакше
      # deploy-pages повертає 403. Перший запуск вмикає сам, далі — no-op.
      - name: Переконатися, що Pages увімкнено
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: https://api.github.com/repos/${{ github.repository }}/pages
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "$API")
          if [ "$code" = "404" ]; then
            echo "Pages вимкнено — вмикаю у режимі workflow"
            curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' "$API" \
              -d '{"build_type":"workflow"}' >/dev/null
          elif [ "$code" != "200" ]; then
            echo "не вдалося дізнатися стан Pages (HTTP $code) — можливо, у GITHUB_TOKEN немає дозволу pages:write" >&2
            exit 1
          else
            echo "Pages уже увімкнено"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
