# Збірка всіх власних застосунків TesseraOS (реєстр — build/scripts/apps.list).
#
# Матриця будується з самого реєстру, тому новий застосунок потрапляє в CI
# тим самий рядом, що й в образ: забути про нього в конфігурації робочого
# процесу більше неможливо — перевірку «Android.bp без рядка в apps.list»
# робить check-app-integration.sh.
#
# Середовище спеціально не покладається на gradlew: політика репо забороняє
# будь-які бінарники в git, а gradle-wrapper.jar — бінарник. Тому Gradle
# ставиться кроком нижче, з перевіркою sha256.
name: build-apps

on:
  push:
    paths:
      - "apps/**"
      - "build/tessera.mk"
      - "build/scripts/**"
      - ".github/workflows/build-apps.yml"
  pull_request:
    paths: ["apps/**", "build/tessera.mk", "build/scripts/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.14.3"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.registry.outputs.apps }}
      count: ${{ steps.registry.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Прочитати реєстр застосунків
        id: registry
        run: |
          set -euo pipefail
          [[ -s build/scripts/apps.list ]] || { echo "порожній реєстр" >&2; exit 1; }
          awk -F"|" '$0 !~ /^[[:space:]]*#/ && NF == 5 {
            printf "{\"app\":\"%s\",\"module\":\"%s\",\"pkg\":\"%s\",\"artifact\":\"%s\",\"category\":\"%s\"}\n", $1, $2, $3, $4, $5
          }' build/scripts/apps.list | jq -s -c '.' > /tmp/apps.json
          rows=$(jq 'length' /tmp/apps.json)
          # Порожній реєстр — не поломка, а можливий стан (2026-10-25 він був
          # порожнім увесь день): власних застосунків у образі немає, тож і
          # матриці теж немає. Раніше тут був exit 1, і кожен push у гілки
          # «вмирала» б саме на ньому.
          echo "apps=$(cat /tmp/apps.json)" >> "$GITHUB_OUTPUT"
          echo "count=$rows" >> "$GITHUB_OUTPUT"
          if [[ "$rows" == 0 ]]; then
            echo "у реєстрі немає активних рядків — job apk пропускаємо (тема збирається в release.yml)"
          else
            jq -r '.[].app' /tmp/apps.json
          fi

  apk:
    needs: discover
    # Матриця з `include: []` — це помилка валідації GitHub, а не порожній
    # запуск, тому job пропускаємо повністю.
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      # Дешево й до збірки: чи модуль взагалі потрапить у образ.
      - name: Перевірити інтеграцію в ROM
        run: bash build/scripts/check-app-integration.sh "${{ matrix.app }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Перевірити Android SDK на раннері
        id: sdk
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          [[ -d "$SDK" ]] || { echo "немає Android SDK за $SDK" >&2; exit 1; }
          if ! ls -d "$SDK"/platforms/android-35 >/dev/null 2>&1; then
            echo "на раннері немає platforms/android-35 — ставимо через sdkmanager" >&2
            "$SDK"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
            "$SDK"/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
          fi
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          ls -1 "$SDK/platforms"

      - name: Встановити Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -euo pipefail
          ZIP="gradle-${GRADLE_VERSION}-bin.zip"
          curl -fsSLO "https://services.gradle.org/distributions/${ZIP}"
          curl -fsSL "https://services.gradle.org/distributions/${ZIP}.sha256" > "${ZIP}.sha256.expected"
          # файл .sha256 від gradle.org — це лише сума без імені файлу,
          # тому імені додаємо вручну перед перевіркою
          printf '%s  %s\n' "$(cat "${ZIP}.sha256.expected")" "$ZIP" | sha256sum --check --strict
          unzip -q "$ZIP" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Зібрати debug APK і прогнати юніт-тести
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain \
            -Pandroid.sdk.channel=0 \
            :app:testDebugUnitTest :app:assembleDebug

      - name: Перевірити маніфест зібраного APK
        run: |
          set -euo pipefail
          APK="apps/${{ matrix.app }}/app/build/outputs/apk/debug/app-debug.apk"
          [[ -f "$APK" ]] || { echo "немає $APK" >&2; exit 1; }
          BT="$(ls -1d "${{ steps.sdk.outputs.sdk }}"/build-tools/*/ | sort -V | tail -1)"
          # Які категорії має оголошувати APK — вирішує не цей step, а спільний
          # скрипт (його ж кличе prepare-app.sh). Подвоєння вже ламало CI: коли
          # вітальня стала майстром першого запуску, тут лишилася вимога LAUNCHER
          # для всіх APK, і job впав саме на ній.
          AAPT2="$BT/aapt2" bash build/scripts/check-apk-manifest.sh \
            "$APK" "${{ matrix.pkg }}" "${{ matrix.category }}"
          # Вивід у змінну, а не в конвеєр до grep -q: той, знайшовши збіг,
          # закриває stdin і вбиває aapt2 SIGPIPE — при pipefail step падає з 141
          # там, де перевірка щойно змоглася.
          BADGE="$("$BT/aapt2" dump badging "$APK")"
          [[ "$BADGE" == *"minSdkVersion:'33'"* ]] || {
            echo "неочікуваний minSdk" >&2; exit 1; }
          echo "ok: ${{ matrix.pkg }}, minSdk 33"

      - name: Перевірити, що в APK немає чужих власницьких ресурсів
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          # Застосунки беруть іконки з PackageManager під час запуску, тому в
          # самих APK жодних іконок чужих застосунків бути не повинно.
          if unzip -l "$APK" | grep -qE "nexuslauncher|product_sans|google_sans|bootanimation"; then
            echo "у APK знайдено власницькі ресурси Google" >&2; exit 1
          fi
          echo "ok: лише наші ресурси"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/${{ matrix.app }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
